<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وَهَج — Wahaj</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body class="notranslate" translate="no">

  <!-- Header -->
  <div class="popup-header">
    <div class="popup-brand">
      <div class="popup-title-group">
        <h1 class="popup-title">وَهَج • Wahaj</h1>
        <p class="popup-tagline">أداة التوثيق والتحليل الأكاديمي</p>
      </div>
    </div>
  </div>

  <!-- Server Status Pill -->
  <div class="status-container">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-label" id="statusText">جاري فحص الخادم...</span>
  </div>

  <!-- Main Toggle Switch -->
  <div class="toggle-card">
    <div class="toggle-info">
      <span class="toggle-title">تفعيل التوثيق في الويب</span>
      <span class="toggle-desc" id="toggleDesc">التوثيق والتحليل مفعّل</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="extensionToggle" checked>
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Footer link -->
  <div class="popup-footer">
    <a href="http://127.0.0.1:8000/docs" target="_blank" class="api-link">
      خادم التحليل: متصل (Swagger Docs)
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
